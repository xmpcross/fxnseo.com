  <path d="M25.5 20 L31 20 L31 25.5" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark (dark, for light backgrounds) -->
  <text x="49" y="31" font-family="'Urbanist','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4">
    <tspan fill="#344767">fxn</tspan><tspan fill="#5e72e4">SEO</tspan><tspan fill="#344767">Tools</tspan>
