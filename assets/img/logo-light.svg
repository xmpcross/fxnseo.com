<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 46" role="img" aria-label="fxnSEOTools">
  <title>fxnSEOTools</title>
  <defs>
    <linearGradient id="fxbadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e72e4"/>
      <stop offset="1" stop-color="#825ee4"/>
    </linearGradient>
  </defs>
  <!-- Badge -->
  <rect x="0" y="3" width="40" height="40" rx="10" fill="url(#fxbadge)"/>
  <!-- Upward growth trend (SEO) -->
