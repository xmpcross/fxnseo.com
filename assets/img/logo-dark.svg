<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 44" width="196" height="44" role="img" aria-label="fxnSEO Tools">
  <title>fxnSEO Tools</title>
  <defs>
    <!-- Dark Mode Gradients matching NXT Smart Home (#151616, #222324, #9895ff, #34d399) -->
    <linearGradient id="fxBadgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b2e"/>
      <stop offset="100%" stop-color="#191a1b"/>
    </linearGradient>
    <linearGradient id="fxBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9895ff"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#7b77e4"/>
    </linearGradient>
    <linearGradient id="fxTrendDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#9895ff"/>
    </linearGradient>
    <linearGradient id="fxSeoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9895ff"/>
      <stop offset="100%" stop-color="#7b77e4"/>
    </linearGradient>
    <filter id="badgeGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9895ff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(2, 2)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="40" height="40" rx="12" fill="url(#fxBadgeDark)" filter="url(#badgeGlowDark)"/>
    <rect x="0" y="0" width="40" height="40" rx="12" fill="none" stroke="url(#fxBorderDark)" stroke-width="1.4"/>
    
    <!-- Geometric Growth Ribbon / Search Node -->
    <!-- Trend Line with Search Eye -->
    <path d="M10 29.5 L17.5 21 L23 25.5 L31.5 14" fill="none" stroke="url(#fxTrendDark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 14 L31.5 14 L31.5 20.5" fill="none" stroke="#9895ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Focus Search Node -->
    <circle cx="17.5" cy="21" r="3.2" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <!-- Launch Dot -->
    <circle cx="31.5" cy="14" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Brand Wordmark Typography -->
  <g transform="translate(52, 29)">
    <text font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" letter-spacing="-0.5px">
      <!-- fxn -->
      <tspan font-weight="800" fill="#ffffff">fxn</tspan>
      <!-- SEO -->
      <tspan font-weight="900" fill="url(#fxSeoDark)">SEO</tspan>
    </text>
  </g>

  <!-- Tag Pill: TOOLS -->
  <g transform="translate(138, 13)">
    <rect x="0" y="0" width="52" height="19" rx="6" fill="#1f2937" stroke="#313131" stroke-width="1"/>
    <text x="26" y="13" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" fill="#9895ff" letter-spacing="1.2px" text-anchor="middle">TOOLS</text>
  </g>
</svg>
